name: Deploy to GitHub Pages

# Builds the Vite app and publishes the production bundle (dist/) to GitHub
# Pages. Because the site is a static SPA, this is all that's needed.
#
# One-time setup in the repository:
#   Settings → Pages → Build and deployment → Source → "GitHub Actions"
# After that, every push to one of the branches below redeploys the site to
#   https://<owner>.github.io/<repo>/

on:
  push:
    branches:
      - main
      - claude/sollers-shop-ecommerce-5hue9w
  # Allows running the deployment manually from the Actions tab.
  workflow_dispatch:

# Grant the token the permissions Pages deployment requires.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress run so a
# live deploy always finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (multi-file, optimized for Pages)
        run: npm run build:pages

      # Static asset host (Actions deploy) never runs Jekyll, but this keeps
      # the artifact safe even for the "deploy from branch" fallback.
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
